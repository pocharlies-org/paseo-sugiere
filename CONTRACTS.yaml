# CONTRACTS.yaml — superficie de contrato de paseo-sugiere.
#
# El servicio `sugiere` (ns llm, imagen de este repo, despliegue k8s-sugiere-pocharlies) lo consumen procesos de otros
# repos: el supervisor de la compañía (x86-host-runtime, libexec/sugiere_puerta.py) y, desde el 07-11-2026, el plugin de Paseo
# de este mismo repo para las sugerencias (su autopilot dejó de llamar a /v1/autopilot el 14-11-2026:
# es la sesión auditora del supervisor, ver `http.supervisor.autopilot.v1`). Sus rutas y nombres de campo son contrato: un renombre o un cambio de forma rompe
# consumidores que los tests de aquí no ven.
#
# Lo existente NO muta. Breaking = entrada nueva `.vN+1`, la vieja a `status: deprecated` con `replaced_by` +
# `remove_after`. Las entradas nunca se borran (retirar = `status: removed`). Un commit que toca superficie de contrato
# actualiza el registro en el mismo push y lleva el trailer `Contract-Change: <accion> <id>`.
#
# Reglas completas y vía de excepción: skill `synapse-contracts`. La especificación: docs/servicio-sugiere.md.
version: 1
canonical_checkout: ~/src/paseo-sugiere
registry_files:
  - CONTRACTS.yaml
contracts:
  - id: http.sugiere.suggest.v1
    kind: http-route
    value: "POST /v1/suggest"
    role: provider
    files:
      - service/server.ts
    status: active
    note: >-
      Registro retroactivo (07-11-2026). Entrada {sid, turno, transcript, contexto?{kind, key, rol, plan}}; salida 200
      {sugerencia, modelo, ms} (+ en_plan, criterio con plan); 422 cuerpo inválido; 503 el modelo no contesta. Consumidores:
      x86-host-runtime libexec/sugiere_puerta.py (compañía, sin kind) y el server del plugin de este repo (kind live).
      Spec: docs/servicio-sugiere.md §2.
  - id: http.sugiere.verdict.v1
    kind: http-route
    value: "POST /v1/verdict"
    role: provider
    files:
      - service/server.ts
    status: active
    note: >-
      Registro retroactivo (07-11-2026). Entrada {sid, turno, sugerencia, contexto{cwd, key?, resumen?, criterio?}}; salida
      siempre 200 {ok, riesgo ninguno|bajo|alto|dinero, motivo, via, traza?}; 422 cuerpo inválido o sin contexto.cwd;
      fail-closed. D9 comprueba el paso aun si cita ficheros de la interfaz: la referencia no autoriza programar tareas.
      Consumidor: x86-host-runtime libexec/sugiere_puerta.py. Spec: docs/servicio-sugiere.md §3-§6.
  - id: http.sugiere.autopilot.v1
    kind: http-route
    value: "POST /v1/autopilot"
    role: provider
    files:
      - service/server.ts
    status: deprecated
    note: >-
      07-11-2026. Entrada {sid, turno, transcript, contexto{cwd, kind?, key?, plan?}, nativa?}; salida 200
      {accion enviar|esperar|humano|cerrar, motivo, mensaje?, fase? arranque|devolver|entregar|aplazar|seguir|desvio, riesgo?,
      modelo?, via?, traza?, pasos{seguidos, total}, ms}; 422 cuerpo inválido o sin contexto.cwd; 503 el modelo o la puerta
      no contestaron (el llamante reintenta una vez). Consumidores: el plugin de Paseo de este repo (F2 del plan) y, en F5,
      el supervisor de la compañía. Spec: docs/servicio-sugiere.md §12. Aditivo (07-11-2026): `contexto.topes`
      {max_seguidos, max_total} opcional, enteros >= 0, 0 = sin tope (y por defecto, sin tope). Aditivo (09-11-2026):
      `fase` `aplazar` (live, espera solo de fecha a >= 2 h: el turno pasa el trabajo a un ticket `programada-<fecha>` y
      cierra con `AUTOPILOT: APLAZADO <KEY> <url>`, que se lee como `cerrar`). Aditivo (13-11-2026): `fase` `security` (un
      `PARA DANI` sin dinero repetido tras `devolver`: el turno lo pasa a security por su ticket y acaba con `PARA SECURITY:`).
      Deprecado (14-11-2026): el plugin dejó de llamar a esta ruta — el autopilot pasó a ser la sesión auditora B del
      supervisor (`http.supervisor.autopilot.v1`), que es quien decide el siguiente paso. La ruta sigue servida
      (service/autopilot.ts) hasta el PR que la retire junto al consumo del supervisor.
    replaced_by: http.supervisor.autopilot.v1
    remove_after: 2026-11-28
  - id: file.paseo.delegations.v1
    kind: file-schema
    value: "rutador-coordinaciones.json"
    role: consumer
    files:
      - server/delegation.ts
    status: deprecated
    note: >-
      09-11-2026 (coordinación de sesiones). Productor: paseo-rutador (su alta vive en su CONTRACTS.yaml); consumidor: el plugin de este repo.
      Fichero en $PASEO_HOME (default ~/.paseo) con el store de coordinaciones, schema v1: {version:1,
      delegations:{[producerId]: {ownerId, producerId, state watching|result|dispatching|paused, ownerActivity,
      producerActivity, sentIds, …}}} — los campos extra pasan, el consumidor no exige forma exacta de la entrada. Todo
      registro activo reserva la propiedad del producer (también `paused`); release = borrar el registro. El consumidor lo
      lee validado (server/delegation.ts): ausente = normal; ilegible, no-JSON o v1 incompleto = fail closed (el autopilot
      no reclama la sesión: rechaza encenderse y para a rojo sin enviar ni archivar). El rutador no escribe
      autopilot.json y el plugin no escribe este fichero.
      El seguimiento de Sugerir comprueba esta reserva antes de enviar, además del registro de parejas del supervisor.
    replaced_by: file.autopilot.pares.v1
    remove_after: 2026-11-28
  - id: http.supervisor.autopilot.v1
    kind: http-route
    value: "POST /autopilot/par"
    anchor: "/autopilot/par"
    role: consumer
    files:
      - server/supervisor.ts
    status: active
    note: >-
      El supervisor sigue siendo el productor de la API de parejas. El plugin solo conserva DELETE /autopilot/par/<a_id>
      para parar parejas existentes. «Seguir en automático» no invoca el POST de creación ni crea sesiones auditoras.
  - id: file.autopilot.pares.v1
    kind: file-schema
    value: "autopilot-pares.json"
    role: consumer
    files:
      - server/pares.ts
    status: active
    note: >-
      14-11-2026 (autopilot como sesión auditora). Productor: el supervisor de la compañía, único escritor (escritura
      atómica), en ~/.company/jira-trigger/autopilot-pares.json — el mismo home donde corre el plugin (paseo-0). Schema v1:
      {version:1, pares:{[a_id]: {a_id, b_id, tipo, origen, modelo, objetivo, key, estado
      activa|pensando|esperando|humano|degradada|entregada, motivo, desde, actualizado, pasos{total, seguidos},
      ultimo_envio}}}. Consumidor: el plugin lo lee para el estado de la ✦ (server/pares.ts): ausente = sin pareja;
      ilegible, no-JSON o v1 incompleto = estado desconocido, sin romper la píldora. El plugin nunca escribe este fichero.
      16-11-2026: lo relee solo cuando cambia (inotify no recursivo de ~/.company/jira-trigger, filtrado por el nombre; la
      escritura atómica por rename es la que lo dispara) y empuja el estado a las píldoras; ya no lo lee en cada consulta.
  - id: file.paseo.suggest-native.v1
    kind: file-schema
    value: ".paseo/suggest/<claude-session-id>.json"
    role: consumer
    files:
      - server/session.ts
    status: active
    note: >-
      26-11-2026 (la sugerencia nativa de la ✦). Productor: el parche `promptSuggestions` del daemon de Paseo en paseo-0
      (repo k8s-paseo-pocharlies, k8s/cron-loop.yaml, `parche-prompt-suggestions.mjs`), único escritor: el fork del CLI de
      Claude Code desde el prefijo cacheado de la sesión. Fichero `<claude-session-id>.json` en `$PASEO_HOME/.paseo/suggest/`
      (sin `PASEO_HOME`, `$HOME/.paseo/suggest/`), schema v1: {text: string, at: number (ms epoch en que lo escribió el daemon)}.
      Uno por sesión: cada turno sobrescribe el anterior, y cae de mediana 27 s (p90 103 s) tras el último mensaje del
      asistente. Consumidor: el plugin lo lee en `nativeSuggestion` (server/session.ts) cuando la ✦ genera, y es el único que lo
      borra. Valida antes de consumir: vale mientras `at` sea posterior al último mensaje de conversación del transcript
      principal (líneas user/assistant, sin sidechain ni meta) y ese mensaje cierre un turno, sin límite de tiempo; si el
      transcript no se puede leer, solo vale con 15 min o menos. Se consume al servirlo (una nativa por turno; el siguiente
      force va al servicio), y solo si el `at` del disco sigue siendo el servido; uno obsoleto, vacío o mal formado no se
      borra al leerlo. Ausente, ilegible o sin `text`/`at` = no hay nativa, sin romper la píldora. El plugin nunca lo escribe.
